<meta charset="utf-8">
<title>SheJalan Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg-end:#FFFFFF; --bg-grad:#FFFFFF; --glass:rgba(255,255,255,.92);
  --surface:#FFFFFF; --surface-2:#F5F6F8; --ink:#1B1F2A; --ink-2:#5A6272; --line:#E4E7EC;
  --brand:#DB2777; --brand-ink:#FFFFFF; --brand-soft:#FCE7F3; --brand-strong:#BE185D;
  --g-brand:#DB2777; --g-hero:#DB2777;
  --plum:#BE185D; --plum-soft:#FCE7F3;
  --sos:#B91C1C; --sos-ink:#FFFFFF; --sos-soft:#FEE2E2;
  --safe:#15803D; --safe-soft:#DCFCE7; --fair:#A16207; --fair-soft:#FEF9C3;
  --caution:#C2410C; --caution-soft:#FFEDD5; --risk:#B91C1C; --risk-soft:#FEE2E2;
  --tint-pink:#F7F8FA; --tint-mint:#F7F8FA; --tint-lilac:#F7F8FA; --tint-orange:#F7F8FA;
  --map-land:#F1F3F6; --map-road:#FFFFFF; --map-water:#CFE8F6; --map-park:#D9F0DF;
  --stage:#FFFFFF; --bezel:#171A21; --shadow:0 10px 30px rgba(16,24,40,.12);
  --card-shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.05);
  --font:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Figtree','Noto Sans',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important} /* JS hides #fab/#tabbar via the hidden attribute; component display rules must not override it */
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:500 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}.ic.xl{width:32px;height:32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* stage */
.stage{height:100%;display:flex;gap:28px;align-items:center;justify-content:center;padding:16px}
.index{width:290px;max-height:100%;overflow:auto;background:var(--surface);border-radius:24px;padding:18px 14px;box-shadow:var(--shadow)}
.index h2{font:600 24px/1.2 var(--display);padding:0 6px;color:var(--brand)}
.index .sub{color:var(--ink-2);font-size:13px;padding:4px 6px 10px}
.index .tools{display:flex;gap:8px;padding:0 6px 12px}
.index h3{font:800 11px/1 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);padding:14px 6px 6px}
.index .links{display:flex;flex-wrap:wrap;gap:4px}
.index .links button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--ink)}
.index .links button[aria-current="true"]{background:var(--g-brand);border-color:transparent;color:#fff}
#idxBtn{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:60;border:0;border-radius:999px;background:var(--g-brand);color:#fff;padding:9px 14px;font-weight:800;box-shadow:var(--shadow)}
.phone{width:392px;height:844px;border:10px solid var(--bezel);border-radius:48px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(16,24,40,.22);flex:none}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 26px 0;font-size:12.5px;font-weight:800;color:var(--ink);zoom:.8}
.status i{display:flex;gap:5px;align-items:center;font-style:normal}
#view:focus{outline:none}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;-ms-overflow-style:none;zoom:.8}
.view::-webkit-scrollbar{display:none}
@media (max-width:860px){.index{display:none}#idxBtn{display:block}.index.open{display:block;position:fixed;inset:0;z-index:70;width:auto;max-height:none;border-radius:0}}
@media (max-width:520px){.stage{padding:0}.phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}}

/* type + primitives */
.pad{padding:8px 16px 24px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:20px}.stack.sm{gap:6px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0;min-height:0}
.h1{font:700 26px/1.15 var(--display);letter-spacing:-.01em;text-wrap:balance}
.h2{font:700 19px/1.25 var(--display);letter-spacing:-.005em}
.h3{font:800 15px/1.3 var(--font)}
.muted{color:var(--ink-2)}
.small{font-size:13px}.xs{font-size:12px}
.eyebrow{font:800 11.5px/1 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--card-shadow)}
.card.flat{background:var(--surface-2);border-color:transparent;box-shadow:none}
.hdr{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;position:sticky;top:0;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5;min-height:52px}
.hdr h1{font:700 18px/1.2 var(--display);flex:1;text-align:center;text-wrap:balance}
.hdr-sp{width:48px;flex:none}
.hdr.left h1{text-align:left}
.ibtn{width:44px;height:44px;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.ibtn:active{background:var(--surface-2)}
.ibtn.solid{background:var(--surface);border:1px solid var(--line)}
.sospill{height:36px;padding:0 13px;border:0;border-radius:999px;background:var(--sos);color:var(--sos-ink);font-weight:800;font-size:12.5px;letter-spacing:.05em;display:flex;align-items:center;gap:5px;flex:none;box-shadow:0 4px 10px rgba(179,0,30,.35)}
.btn{min-height:52px;border-radius:999px;border:1.5px solid transparent;padding:0 20px;font-weight:800;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(190,24,93,.25)}
.btn.soft{background:var(--brand-soft);color:var(--brand-strong)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.dark{background:#1B1F2A;color:#fff}
.btn.sos{background:var(--sos);color:var(--sos-ink)}
.btn.link{background:none;min-height:44px;color:var(--brand-strong);width:auto;padding:0 8px}
.btn.sm{min-height:40px;font-size:14px;width:auto;padding:0 16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:800;font-size:13.5px}
.field input,.field select,.field textarea{min-height:50px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 16px;width:100%}
.field textarea{min-height:92px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--ink-2)}
.field .with-ic{position:relative}
.field .with-ic .ic{position:absolute;left:15px;top:15px;color:var(--brand)}
.field .with-ic input{padding-left:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:transparent;color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips.scroll .chip{flex:none}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font-weight:800;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand-strong);box-shadow:0 1px 3px rgba(16,24,40,.14)}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--ts,var(--surface-2));color:var(--t,var(--ink))}
.t-safe{--t:var(--safe);--ts:var(--safe-soft)}.t-fair{--t:var(--fair);--ts:var(--fair-soft)}
.t-caution{--t:var(--caution);--ts:var(--caution-soft)}.t-risk{--t:var(--risk);--ts:var(--risk-soft)}
.t-brand{--t:var(--brand-strong);--ts:var(--brand-soft)}.t-plum{--t:var(--plum);--ts:var(--plum-soft)}.t-mute{--t:var(--ink-2);--ts:var(--surface-2)}
.sticky-cta{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg-end) 72%,transparent);padding:20px 16px 16px;display:flex;flex-direction:column;gap:8px;z-index:4}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;min-height:56px}
.li:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:14px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;flex:none}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:var(--brand-soft);color:var(--brand-strong)}
.avatar.a2{background:var(--plum-soft);color:var(--plum)}.avatar.a3{background:var(--fair-soft);color:var(--fair)}.avatar.a4{background:var(--caution-soft);color:var(--caution)}
.avatar.lg{width:76px;height:76px;font-size:26px;font-family:var(--display)}
.toggle{width:52px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle[aria-checked="true"]{background:var(--g-brand)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#1E0A18;color:#fff;padding:12px 16px;border-radius:18px;font-weight:700;font-size:14px;z-index:40;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.progress{display:flex;gap:6px;padding:4px 16px 0}
.progress i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.progress i.on{background:var(--g-brand)}
.note{display:flex;gap:10px;background:var(--surface-2);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
.note .ic{margin-top:1px;color:var(--brand)}
.note.warn{background:var(--fair-soft);color:var(--ink);box-shadow:none}.note.warn .ic{color:var(--fair)}

/* mascot + illustration language */
.mascot{display:block;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(16,24,40,.18))}
.hero{position:relative;background:var(--g-hero);color:#fff;border-radius:24px;padding:44px 16px 18px;box-shadow:0 10px 24px rgba(190,24,93,.26)}
.hero .mascot{position:absolute;right:-2px;top:-46px;width:118px;height:118px;pointer-events:none}
.hero .eyebrow{color:rgba(255,255,255,.92)}
.hero .btn.link{color:#fff}
.ringw{--ring-ink:#3B1030;--ring-ink2:#7A4F6C;background:#fff;border-radius:50%;padding:5px;box-shadow:0 6px 14px rgba(0,0,0,.14);flex:none}
.tile-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.tile-ic.g-pink,.tile-ic.g-lilac,.tile-ic.g-orange,.tile-ic.g-mint,.tile-ic.g-blue,.floater.sq.g-pink,.floater.sq.g-orange{background:var(--brand-soft);color:var(--brand-strong)}
.tile-ic.g-red,.floater.sq.g-red{background:var(--sos);color:#fff}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:800;font-size:11.5px;color:var(--ink);padding:0;min-height:44px}
.banner{position:relative;border-radius:22px;padding:16px;overflow:visible;background:var(--surface-2);color:var(--ink)}
.banner .art{position:absolute;right:8px;top:8px;bottom:8px;width:44%;border-radius:20px;overflow:hidden}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.stagebox{position:relative;display:grid;place-items:center;overflow:hidden}
.floater{position:absolute;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:12.5px;box-shadow:var(--card-shadow);color:var(--ink)}
.floater.sq{border-radius:16px;padding:0;width:44px;height:44px;justify-content:center;color:#fff}

/* tabbar + fab */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));position:relative;z-index:20;zoom:.8}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:4px 0;font-size:11.5px;font-weight:800;color:var(--ink-2)}
.tab[aria-current="page"]{color:var(--brand-strong)}
.tab[aria-current="page"] .ic{stroke-width:2.5}
.tab.sos{color:var(--sos)}
.tab.sos .pl{width:54px;height:54px;border-radius:50%;background:var(--sos);color:#fff;display:grid;place-items:center;margin-top:-26px;border:4px solid var(--surface);box-shadow:0 6px 14px rgba(185,28,28,.4)}
.fab{position:absolute;right:14px;bottom:88px;width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 30% 25%,#E6203F,#A50019);color:#fff;font-weight:800;font-size:13px;letter-spacing:.05em;z-index:30;box-shadow:0 0 0 5px rgba(179,0,30,.22),0 10px 20px rgba(179,0,30,.45);display:grid;place-items:center}

/* score */
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--line)}
.ring-fg{fill:none;stroke:var(--t);stroke-linecap:round}
.ring-n{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-n b{font:700 40px/1 var(--display);color:var(--ring-ink,var(--ink))}
.ring-n span{font-size:12px;color:var(--ring-ink2,var(--ink-2));margin-top:2px}
.ring.sm .ring-n b{font-size:28px}
.frow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center}
.frow .nm{font-weight:700;font-size:14px}
.frow .val{font-weight:800;font-size:14px}
.bar{grid-column:1/-1;height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--t)}
.qbox{border-radius:22px;background:var(--surface);padding:14px 16px;color:var(--ink);font-size:14.5px;box-shadow:var(--card-shadow);position:relative}
.qbox .eyebrow{color:var(--brand-strong);display:flex;gap:6px;align-items:center;margin-bottom:6px}

/* map */
.mapbox{position:relative;background:var(--map-land);overflow:hidden}
.mapbox svg.bg{display:block;width:100%;height:100%}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);padding:0}
.pin .ic{width:16px;height:16px}
.pin.p-police{background:#3E6FD8}.pin.p-hosp{background:#D92D20}.pin.p-pharm{background:#12966A}.pin.p-trans{background:#7A3FD1}.pin.p-rep{background:#B36A00}
.pin.p-rep.ver{background:#0F6B3D}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -8px 28px rgba(16,24,40,.16);z-index:8;max-height:78%;overflow:auto;padding:6px 16px 18px}
.grab{width:100%;height:28px;border:0;background:none;display:grid;place-items:center}
.grab i{width:44px;height:5px;border-radius:9px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:34px;height:8px}

/* misc */
.tile{width:100%;aspect-ratio:16/10;border-radius:16px;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 12px;scrollbar-width:none}
.hscroll>*{flex:none}
.pcard{width:170px;padding:0;overflow:hidden;position:relative;border-radius:24px}
.pcard .scene{height:104px;position:relative;overflow:hidden}
.pcard .scene svg{display:block;width:100%;height:100%}
.pcard .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.pcard.pk{background:var(--tint-pink)}.pcard.mt{background:var(--tint-mint)}.pcard.lc{background:var(--tint-lilac)}.pcard.or{background:var(--tint-orange)}
.ribbon{position:absolute;top:10px;left:0;background:#0F7F53;color:#fff;font:800 10.5px/1 var(--font);padding:5px 10px 5px 8px;border-radius:0 9px 9px 0;letter-spacing:.06em;z-index:2}
.plus{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;border:0;display:grid;place-items:center;flex:none}
.stars{display:flex;gap:2px;color:#F2A100}
.stars .ic{fill:currentColor}
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.stepper li{display:flex;gap:12px;position:relative;padding-bottom:14px}
.stepper li:last-child{padding-bottom:0}
.stepper li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.stepper li:last-child::before{display:none}
.stepper .dot{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex:none;z-index:1;font-size:12px;font-weight:800}
.stepper li.done .dot{background:var(--safe);color:#fff}
.stepper li.now .dot{background:var(--g-brand);color:#fff}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:14px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-2)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.keys button{height:60px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font:600 24px var(--display)}
.holdwrap{position:relative;width:200px;height:200px;margin:0 auto}
.holdwrap svg{position:absolute;inset:0;width:100%;height:100%}
.hold{position:absolute;inset:16px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 25%,#E6203F,#A50019);color:#fff;font:600 36px/1 var(--display);letter-spacing:.04em;display:grid;place-content:center;gap:4px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none}
.hold small{font:700 12.5px var(--font);letter-spacing:0}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
.bob{animation:bob 3.2s ease-in-out infinite}
.an li{opacity:.35;animation:doneStep .4s forwards}
.an li:nth-child(1){animation-delay:.4s}.an li:nth-child(2){animation-delay:1s}.an li:nth-child(3){animation-delay:1.6s}.an li:nth-child(4){animation-delay:2.2s}.an li:nth-child(5){animation-delay:2.8s}
@keyframes doneStep{to{opacity:1}}
.an li .ic{color:var(--brand)}
.an li{display:flex;gap:10px;align-items:center;font-weight:700}
.story{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 20px 20px;color:var(--ink);background:#FFFFFF;overflow:hidden}
.story .bars{display:flex;gap:5px;position:relative;z-index:2}
.story .bars i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.story .bars i.on{background:var(--brand)}
.story .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;animation:rise .4s;position:relative;z-index:2}
.story .big{font:600 68px/1 var(--display)}
.story .btn.ghost{color:var(--ink);border-color:var(--line);background:var(--surface)}
.story .btn.primary{background:var(--brand);color:#fff;box-shadow:none}
.story .stat{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.story .stat b{font:600 46px/1 var(--display);min-width:88px}
.story .mascot{position:absolute;right:-24px;bottom:110px;width:170px;height:170px;opacity:.28;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.an li{opacity:1}}

.btn,.chip,.badge,.tab,.eyebrow,.seg button,.sospill,.lbl,.field label,.li b,.h3,.floater,.quick button,.ribbon,.fab,.hold,.index h3,.index .links button{font-family:var(--display)}
.btn{font-weight:700}
.meter{width:100%}
.m-top{display:flex;align-items:baseline;gap:5px}
.m-n{font:700 58px/1 var(--display);letter-spacing:-.03em}
.m-of{font:600 15px var(--display);color:var(--ink-2)}
.m-scale{position:relative;display:flex;gap:3px;height:10px;margin:12px 0 6px}
.m-seg{border-radius:99px;opacity:.3}
.m-seg.risk{background:var(--risk)}.m-seg.caution{background:var(--caution)}.m-seg.fair{background:var(--fair)}.m-seg.safe{background:var(--safe)}
.m-seg.act{opacity:1}
.m-mark{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 1px 4px rgba(16,24,40,.3)}
.m-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2)}
.meter.sm .m-n{font-size:32px}.meter.sm .m-of{font-size:12px}.meter.sm .m-scale{height:6px;margin:8px 0 4px}.meter.sm .m-mark{width:12px;height:12px;margin:-6px 0 0 -6px;border-width:2.5px}.meter.sm .m-lbl{display:none}
.meter.on-dark .m-n{color:#fff}.meter.on-dark .m-of,.meter.on-dark .m-lbl{color:rgba(255,255,255,.9)}
.meter.on-dark .m-seg{background:#fff;opacity:.38}.meter.on-dark .m-seg.act{opacity:1}
.meter.on-dark .m-mark{background:var(--brand);border-color:#fff}
.bar{height:8px}
</style>

const $=s=>document.querySelector(s);
const I=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const rp=n=>'Rp'+n.toLocaleString('en-US');
const tier=s=>s>=80?{k:'safe',l:'Safe',i:'shieldc'}:s>=65?{k:'fair',l:'Fairly safe',i:'shield'}:s>=50?{k:'caution',l:'Caution',i:'alert'}:{k:'risk',l:'At risk',i:'octagon'};
const tbadge=s=>{const t=tier(s);return `<span class="badge t-${t.k}">${I(t.i,'sm')}${t.l}</span>`};
const ring=(s,size=140,sw=13,cls='')=>{const r=(size-sw)/2,c=2*Math.PI*r,t=tier(s),m=size/2;

  <div class="stack sm"><h1 class="h1">Where are you going?</h1><p class="muted">Step 1 of 3 · Origin and destination</p></div>

  <div class="field"><span class="lbl">Popular destinations</span>${chips(['Gunungkidul','Prambanan','Parangtritis','Kaliurang','YIA Airport'],'one',[0])}</div>
  ${btn('Continue','plan2')}</div>`});
def('plan2','C','Plan 2 · Time',{html:()=>`${planHdr(2)}<div class="pad stack lg">

  <div class="field"><span class="lbl">Mode of transport</span>${chips([`${I('bike','sm')}Motorbike`,`${I('car','sm')}Car / taxi`,`${I('bus','sm')}Public transport`,`${I('walk','sm')}Walking`],'one',[0])}</div>

def('an','C','Analyzing',{html:()=>`<div class="pad stack lg" style="min-height:100%;justify-content:center;text-align:center;align-items:center">
  <div class="bob">${logo(132)}</div><h1 class="h1">AI is analyzing</h1><p class="muted">Combining location data, community reports, and route conditions.</p>
  <ul class="an stepper" style="align-self:stretch;gap:12px;text-align:left;margin-top:10px;list-style:none;padding:0">${['Destination and area data','Latest community reports','Lighting and route conditions','Transport availability','Travel time and emergency access'].map(t=>`<li>${I('check')}${t}</li>`).join('')}</ul>
  ${btn('Skip animation','result','link')}</div>`,after(){st.timers.push(setTimeout(()=>{if(st.cur==='an')go('result',{replace:true})},3600))}});
def('result','C','Analysis results',{html:()=>{const o=overall(),t=tier(o),F=factors();
  const cx=110,cy=112,R=78,ax=['Destination','Route','Night','Transport','Emergency','Community'];
  const pt=(i,v)=>{const a=-Math.PI/2+i*Math.PI/3;return [cx+R*v/100*Math.cos(a),cy+R*v/100*Math.sin(a)]};
  const radar=`<svg viewBox="0 0 220 224" style="width:100%;max-width:300px;margin:0 auto;display:block" role="img" aria-label="Radar of 6 factors: ${F.map((f,i)=>ax[i]+' '+f[1]).join(', ')}">${[.25,.5,.75,1].map(k=>`<polygon points="${ax.map((_,i)=>pt(i,k*100).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('')}${ax.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,100)[0]}" y2="${pt(i,100)[1]}" stroke="var(--line)"/>`).join('')}<polygon points="${F.map((f,i)=>pt(i,f[1]).join(',')).join(' ')}" fill="var(--brand)" fill-opacity=".22" stroke="var(--brand)" stroke-width="2.5"/>${F.map((f,i)=>{const p=pt(i,f[1]);return `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--brand)"/>`}).join('')}${ax.map((a,i)=>{const p=pt(i,122);return `<text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="Plus Jakarta Sans">${a} ${F[i][1]}</text>`}).join('')}</svg>`;
  const bars=`<div class="stack">${F.map(f=>{const tt=tier(f[1]);return `<div class="frow t-${tt.k}"><span class="nm">${f[0]}</span><span class="val num" style="color:var(--t)">${f[1]} · ${tt.l}</span><div class="bar" role="img" aria-label="${f[0]} ${f[1]} out of 100"><i style="width:${f[1]}%"></i></div></div>`}).join('')}</div>`;
  const warns=[['clock','Risk rises after 19:00, especially on the coastal road.',st.ret>='21:00'||st.ret==='22:00'?1:0],['alert','Parts of the route have little lighting.',1],['bus','Alternative transport is limited after 20.00.',st.ret==='19:30'?0:1],['flag','There are community reports in this area: 2 verified, 1 unverified.',1]].filter(w=>w[2]);
  return `${hdr('Analysis results')}<div class="pad stack lg">
  <div class="hero stack" style="margin-top:36px"><img class="mascot bob" src="${LOGO}" alt=""><span class="eyebrow" style="max-width:62%;line-height:1.35">Yogyakarta → Gunungkidul · 26 Sep · Motorbike · Solo</span><div style="margin-top:4px">${meter(o,{dark:1})}</div><div>${tbadge(o)}</div><p class="small" style="opacity:.96">Estimate based on local data and community reports. It supports your decision and is not a guarantee of safety.</p></div>
  <section class="stack"><div class="row between"><h2 class="h2">6-factor breakdown</h2></div><div class="seg" role="group" aria-label="Chart view">${['Bars','Radar'].map(v=>`<button type="button" data-act="view" data-v="${v}" aria-pressed="${st.view===v}">${v}</button>`).join('')}</div>${st.view==='Bars'?bars:radar}</section>
  <section class="stack"><h2 class="h2">Try another return time</h2><div class="chips" role="group" aria-label="Return time">${Object.keys(NIGHT).map(k=>`<button class="chip" type="button" data-act="ret" data-v="${k}" aria-pressed="${st.ret===k}">${I('clock','sm')}${k}</button>`).join('')}</div><p class="muted small">Night-time score for returning at ${st.ret}: <b class="num">${NIGHT[st.ret]}</b></p></section>
  <section class="stack"><h2 class="h2">Things to note</h2>${warns.map(w=>`<div class="note warn">${I(w[0])}<span>${w[1]}</span></div>`).join('')}</section>
  <section class="qbox" aria-label="AI recommendation"><div class="eyebrow">${I('spark','sm')}AI recommendation</div>${ADVICE[st.ret]}</section>
  <button type="button" class="card row" data-go="rp" style="text-align:left"><span class="ico" style="width:44px;height:44px;background:var(--brand-soft);color:var(--brand-strong)">${I('route')}</span><span class="grow"><b>View route by risk</b><br><span class="muted small">3 segments, 1 poorly lit stretch</span></span>${I('cr','sm')}</button></div>
  <div class="sticky-cta">${btn('Start monitoring','tl','primary','shieldc')}<div class="row">${btn('Save trip','trips','ghost','','style="min-height:46px"')}${btn('Book a guide','guides','ghost','users','style="min-height:46px"')}</div></div>`}});
def('rp','C','Route preview',{html:()=>{const seg=(d,c,dash)=>`<path d="${d}" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
  return `${hdr('Route by risk')}<div class="pad stack lg"><div class="mapbox" style="height:280px;border-radius:18px"><svg class="bg" viewBox="0 0 360 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Route map from the city center to Gunungkidul with three segments of different risk"><rect width="360" height="280" fill="var(--map-land)"/><path d="M0 240q80-30 150-10t210-40v90H0z" fill="var(--map-water)"/><path d="M40 60q40-20 80 0t60-6" stroke="var(--map-road)" stroke-width="8" fill="none"/>
  ${seg('M40 70Q90 90 130 110','var(--safe)')}${seg('M130 110Q190 130 230 150','var(--fair)','14 9')}${seg('M230 150Q280 170 320 200','var(--caution)','2 10')}
  <circle cx="40" cy="70" r="9" fill="var(--brand)" stroke="#fff" stroke-width="3"/><circle cx="320" cy="200" r="9" fill="var(--ink)" stroke="#fff" stroke-width="3"/></svg></div>
  <div class="legend" aria-label="Legend">${[['var(--safe)','','Safe'],['var(--fair)','14 9','Fairly safe'],['var(--caution)','2 10','Caution']].map(l=>`<span><svg viewBox="0 0 34 8"><path d="M2 4h30" stroke="${l[0]}" stroke-width="6" stroke-linecap="round" ${l[1]?`stroke-dasharray="${l[1]}"`:''}/></svg>${l[2]}</span>`).join('')}</div>
  <div class="card list">${[['Malioboro → Piyungan','17:00–17:40',84,'Main road, busy'],['Piyungan → Wonosari','17:40–18:30',72,'Traffic flows well, narrow shoulder'],['Wonosari → Beach','18:30–19:20',54,'Little lighting after 19:00']].map(s=>`<div class="li"><span class="grow"><b class="small">${s[0]}</b><br><span class="muted xs">${s[1]} · ${s[3]}</span></span>${tbadge(s[2])}</div>`).join('')}</div>
  ${btn('Back to results','result','ghost')}</div>`}});

/* D. map */
def('map','D','Safety Map',{nav:true,tab:'map',fab:false,html:()=>{
  const L=[['police','Police','shieldc'],['hosp','Hospital','cross'],['pharm','Pharmacy','pill'],['trans','Transport','bus'],['risk','Risk zones','alert'],['rep','Reports','flag']];
  const pins={police:[[30,26],[60,44],[74,70]],hosp:[[46,56],[20,44]],pharm:[[36,48],[62,30]],trans:[[52,22],[28,72]]};
  const ic={police:'shieldc',hosp:'cross',pharm:'pill',trans:'bus'};
  return `<div style="height:100%;position:relative;display:flex;flex-direction:column">
  <div style="padding:6px 12px 8px;background:var(--bg);z-index:9" class="stack sm"><div class="row"><button class="ibtn" type="button" data-back aria-label="Back">${I('cl','lg')}</button><div class="field grow"><div class="with-ic">${I('search')}<input id="ms" type="search" placeholder="Search area or place" aria-label="Search area"></div></div></div>
  <div class="chips scroll" role="group" aria-label="Map layers">${L.map(l=>`<button class="chip" type="button" data-act="layer" data-v="${l[0]}" aria-pressed="${st.layers.has(l[0])}">${I(l[2],'sm')}${l[1]}</button>`).join('')}</div></div>
  <div class="mapbox grow" id="mapbox"><svg class="bg" viewBox="0 0 390 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Safety map of the Yogyakarta area with score heatmap"><defs><filter id="bl"><feGaussianBlur stdDeviation="14"/></filter></defs><rect width="390" height="520" fill="var(--map-land)"/><rect x="250" y="360" width="150" height="170" fill="var(--map-park)"/><path d="M0 430q100-30 190 0t200-30v160H0z" fill="var(--map-water)"/>
  <g stroke="var(--map-road)" fill="none" stroke-linecap="round"><path d="M0 120L390 200" stroke-width="12"/><path d="M120 0L200 520" stroke-width="12"/><path d="M0 300q120-30 390 40" stroke-width="8"/><path d="M290 0L250 300" stroke-width="7"/><path d="M0 40q100 40 190 90" stroke-width="6"/></g>
  <g filter="url(#bl)" opacity=".62"><circle cx="150" cy="150" r="60" fill="var(--safe)"/><circle cx="220" cy="240" r="55" fill="var(--fair)"/><circle cx="90" cy="300" r="50" fill="var(--caution)"/><circle cx="300" cy="150" r="40" fill="var(--safe)"/><circle cx="280" cy="330" r="45" fill="var(--risk)"/></g>
  ${st.layers.has('risk')?`<g fill="none" stroke="var(--risk)" stroke-width="3" stroke-dasharray="6 5"><circle cx="280" cy="330" r="52"/><circle cx="90" cy="300" r="44"/></g><text x="280" y="333" text-anchor="middle" font-size="11" font-weight="800" fill="var(--risk)" font-family="Plus Jakarta Sans">Risk zone</text>`:''}
  <circle cx="190" cy="200" r="9" fill="#2563EB" stroke="#fff" stroke-width="3"/></svg>
  ${Object.entries(pins).filter(([k])=>st.layers.has(k)).map(([k,ps])=>ps.map((p,i)=>`<button class="pin p-${k}" type="button" style="left:${p[0]}%;top:${p[1]}%" data-act="toast" data-v="${L.find(l=>l[0]===k)[1]} nearby · ${300+i*350} m" aria-label="${L.find(l=>l[0]===k)[1]} ${i+1}">${I(ic[k])}</button>`).join('')).join('')}
  ${st.layers.has('rep')?REPORTS.map(r=>`<button class="pin p-rep ${r.v==='ver'?'ver':''}" type="button" style="left:${r.x}%;top:${r.y}%" data-go="rd" aria-label="Report: ${r.t}">${I('flag')}</button>`).join(''):''}
  <div class="sheet" style="${st.sheet?'':'max-height:210px;overflow:hidden'}"><button class="grab" type="button" data-act="sheet" aria-label="${st.sheet?'Collapse':'Expand'} area details" aria-expanded="${st.sheet}"><i></i></button>
   <div class="row between"><div><h2 class="h2">Malioboro</h2><p class="muted small">Area around the blue dot</p></div><div style="width:128px">${meter(78,{sm:1})}</div></div>
   <div class="row wrap" style="margin:8px 0">${tbadge(78)}<span class="badge t-mute">${I('users','sm')}Busy</span><span class="badge t-fair">${I('clock','sm')}Drops after 21:00</span></div>
   <h3 class="h3" style="margin:10px 0 4px">Latest reports</h3><div class="list">${REPORTS.map(r=>`<button class="li" type="button" data-go="rd"><span class="grow"><b class="small">${r.t}</b><br><span class="muted xs">${r.c} · ${r.ago}</span></span>${vbadge(r.v)}</button>`).join('')}</div>
   <div class="row" style="margin-top:10px">${btn('Check route here','plan1','soft','route')}</div></div></div></div>`}});
def('rd','D','Report details',{html:()=>`${hdr('Report details')}<div class="pad stack lg">
  <div class="row wrap"><span class="badge t-caution">${I('alert','sm')}Warning</span>${vbadge('ver')}</div>
  <h1 class="h1" style="font-size:22px">Unusual fares after 21:00</h1>

  <div class="card stack"><div class="row between"><span class="badge t-brand">${I('cal','sm')}Tomorrow, 26 Sep</span>${tbadge(74)}</div><h1 class="h1" style="font-size:22px">Yogyakarta → Gunungkidul</h1><div class="row muted small" style="gap:14px"><span class="row" style="gap:5px">${I('bike','sm')}Motorbike</span><span class="row" style="gap:5px">${I('user','sm')}Solo</span></div></div>

def('tl','E','Trip in progress',{fab:false,html:()=>`${hdr('Trip in progress',{right:sosPill})}<div class="pad stack lg">

const HOLD=3000;
def('sos1','F','SOS · Confirm',{tone:'sos',fab:false,html:()=>`<header class="hdr" style="background:transparent"><button class="ibtn" type="button" data-go="home" aria-label="Cancel and go back">${I('x','lg')}</button><h1>Emergency</h1><span class="hdr-sp"></span></header>
  <div class="pad stack lg" style="align-items:center;text-align:center">
  <div class="stack sm"><h1 class="h1">Need help right now?</h1><p style="color:var(--ink-2)">Hold the button for 3 seconds to activate SOS. This prevents accidental presses.</p></div>
  <div class="holdwrap"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="none" style="stroke:var(--sos-soft)" stroke-width="10"/><circle id="holdArc" cx="100" cy="100" r="92" fill="none" style="stroke:var(--sos)" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 578" transform="rotate(-90 100 100)"/></svg>
  <button class="hold ${st.cd?'':'pulse'}" id="hold" type="button" aria-label="Hold for 3 seconds to activate SOS. Or press Enter for a countdown"><span id="holdTxt">${st.cd?st.cd:'SOS'}</span><small id="holdSm">${st.cd?'Tap Cancel to stop':'Hold for 3 seconds'}</small></button></div>
  <div class="stack" style="width:100%">${st.cd?btn('Cancel countdown','','ghost','x','data-act="cdcancel"'):btn('Use a 5-second countdown','','ghost','clock','data-act="cdstart"')}${btn('Cancel, I am fine','home','link','','')}</div>
  <div class="note" style="text-align:left">${I('info')}<span>After activation: your location is shared, your contacts are notified, and official emergency numbers are shown.</span></div></div>`,after(){
    const b=$('#hold'),arc=$('#holdArc');if(!b)return;let raf,t0=0;
    const stop=()=>{cancelAnimationFrame(raf);t0=0;arc.setAttribute('stroke-dasharray','0 578');$('#holdSm').textContent='Hold for 3 seconds'};
    const tick=()=>{const p=Math.min(1,(performance.now()-t0)/HOLD);arc.setAttribute('stroke-dasharray',`${(578*p).toFixed(0)} 578`);if(p>=1){t0=0;go('sos2');return}raf=requestAnimationFrame(tick)};
    const start=e=>{e.preventDefault();if(st.cd)return;t0=performance.now();$('#holdSm').textContent='Keep holding…';raf=requestAnimationFrame(tick)};
    b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(t0)stop()}));
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cdStart()}});
    st.timers.push({});
  }});

  <section class="stack"><h2 class="h2">What to do</h2><ol class="stepper">${['Head to a busy, well-lit place, such as a shop or hotel.','Do not turn off your phone. Battery and signal are the priority.','Stay on the line if you have already called 110 or 112.','Tell officers or people around you that you need help.'].map((s,i)=>`<li><span class="dot">${i+1}</span><span class="small">${s}</span></li>`).join('')}</ol></section>

 ()=>`<p class="eyebrow" style="color:var(--brand-strong)">SheJalan Wrapped</p><h1 class="big" style="font-size:54px">Your year of travel, Nadia.</h1><p style="font-size:17px;opacity:.9">A recap of your solo journeys in 2026.</p>`,
 ()=>`<p class="eyebrow" style="color:var(--brand-strong)">You explored</p><div><div class="stat"><b>7</b><span>destinations</span></div><div class="stat"><b>426</b><span>km traveled</span></div><div class="stat"><b>3</b><span>night trips</span></div></div>`,
 ()=>`<p class="eyebrow" style="color:var(--brand-strong)">Safest month</p><h1 class="big">October</h1><p style="font-size:17px;opacity:.9">Your average trip score was 84. Most visited area: Yogyakarta.</p>`,
 ()=>`<p class="eyebrow" style="color:var(--brand-strong)">Women guides</p><h1 class="big">5</h1><p style="font-size:17px;opacity:.9">guides you booked this year. You are most comfortable with a relaxed pace.</p>`,
 ()=>`<p class="eyebrow" style="color:var(--brand-strong)">Your travel personality</p><h1 class="big" style="font-size:52px">The Calm Explorer</h1><p style="font-size:17px;opacity:.9">You like culture, unhurried time, and well-lit routes.</p>`];

/* ---------- engine ---------- */
const FLOWS={A:'A · Onboarding & Auth',B:'B · Home',C:'C · Plan Trip / AI',D:'D · Safety Map',E:'E · Trip Monitoring',F:'F · Emergency',G:'G · Community',H:'H · Guide',I:'I · Profile'};
const NAV=[['home','home','Home'],['plan1','route','Plan'],['sos1','alert','SOS'],['community','users','Community'],['trips','bag','Trip']];
function buildIndex(){let h=`<h2>SheJalan</h2><p class="sub">Clickable prototype. All data is sample data.</p>`;
  Object.keys(FLOWS).forEach(f=>{h+=`<h3>${FLOWS[f]}</h3><div class="links">${Object.values(S).filter(s=>s.flow===f).map(s=>`<button type="button" data-jump="${s.id}" aria-current="${s.id===st.cur}">${s.name}</button>`).join('')}</div>`});$('#index').innerHTML=h}
function buildTabs(){const cur=S[st.cur].tab;$('#tabbar').innerHTML=NAV.map(([g,ic,l])=>{const c=g==='sos1',on=g==='plan1'?cur==='plan':cur===g;return `<button class="tab ${c?'sos':''}" type="button" data-go="${g}" ${on?'aria-current="page"':''}>${c?`<span class="pl">${I(ic,'lg')}</span>`:I(ic,'lg')}<span>${l}</span></button>`}).join('')}
function render(keep){const s=S[st.cur],v=$('#view'),y=keep?v.scrollTop:0;v.innerHTML=s.html();$('#tabbar').hidden=!s.nav;$('#fab').hidden=true;$('#phone').dataset.tone=s.tone||'';if(s.nav)buildTabs();v.scrollTop=y;s.after&&s.after();document.querySelectorAll('[data-jump]').forEach(b=>b.setAttribute('aria-current',b.dataset.jump===st.cur))}
function go(id,o={}){if(!S[id])return;clearT();if(!o.replace&&!o.noHist)st.hist.push(st.cur);if(S[id].nav&&!o.keepHist&&NAV.some(n=>n[0]===id))st.hist=[];st.cur=id;if(id==='sos1')st.cd=0;if(id==='sos3')st.pin='';if(id==='ci')st.esc=0;if(id==='wr')st.story=0;render();$('#view').focus({preventScroll:true})}
function back(){clearT();const p=st.hist.pop();st.cur=p||'home';st.cd=0;render();}
function toast(m){const h=$('#toastHost');h.innerHTML=`<div class="toast" role="status">${I('check','sm')}<span>${m}</span></div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2600)}
function setTheme(t){st.theme=t==='auto'?null:t;const r=document.documentElement;if(st.theme)r.dataset.theme=st.theme;else r.removeAttribute('data-theme');try{localStorage.setItem('sj-theme',t)}catch(e){}}
function cdStart(){st.cd=5;render(true);const t=setInterval(()=>{if(st.cur!=='sos1'||!st.cd){clearInterval(t);return}st.cd--;if(st.cd<=0){clearInterval(t);st.cd=0;go('sos2');return}const e=$('#holdTxt');if(e)e.textContent=st.cd},1000);st.timers.push(t)}
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]');if(j){st.hist=[];go(j.dataset.jump,{noHist:true});$('#index').classList.remove('open');return}
  if(e.target.closest('#idxBtn')){$('#index').classList.toggle('open');return}
  const b=e.target.closest('[data-back]');if(b){back();return}
  const a=e.target.closest('[data-act]');
  if(a){const v=a.dataset.v,k=a.dataset.act;
    if(k==='toast'){toast(v);if(a.dataset.go)go(a.dataset.go);return}
    if(k==='copy'){try{navigator.clipboard.writeText(v).then(()=>toast('Link copied'),()=>toast('Press and hold to copy: '+v))}catch(er){toast(v)}return}
    if(k==='authtab'){st.authTab=v;render(true);return}
    if(k==='showpw'){const p=$('#pw');p.type=p.type==='password'?'text':'password';a.textContent=p.type==='password'?'Show password':'Hide password';return}
    if(k==='ret'){st.ret=v;render(true);return}
    if(k==='view'){st.view=v;render(true);return}
    if(k==='layer'){st.layers.has(v)?st.layers.delete(v):st.layers.add(v);render(true);return}
    if(k==='sheet'){st.sheet=!st.sheet;render(true);return}
    if(k==='ttab'){st.tripTab=v;render(true);return}
    if(k==='esc'){st.esc=Math.min(4,st.esc+1);render(true);return}
    if(k==='cat'){st.cat=v;render(true);return}
    if(k==='post'){st.post=v;go('pd');return}
    if(k==='guide'){st.guide=v;go('gp');return}
    if(k==='svc'){st.svc=+v;render(true);return}
    if(k==='pay'){st.pay=+v;render(true);return}
    if(k==='story'){st.story=Math.max(0,Math.min(4,st.story+ +v));render(true);return}
    if(k==='theme'){setTheme(v==='next'?((st.theme||'auto')==='dark'?'light':'dark'):v);if(st.cur==='set')render(true);return}
    if(k==='rate'){a.parentElement.querySelectorAll('[data-act=rate]').forEach(x=>{const on=+x.dataset.v<=+v;x.setAttribute('aria-pressed',x===a);x.querySelector('.ic').style.fill=on?'currentColor':'none'});return}
    if(k==='cdstart'){cdStart();return}
    if(k==='cdcancel'){st.cd=0;clearT();render(true);return}
    if(k==='key'){if(v==='del')st.pin=st.pin.slice(0,-1);else if(st.pin.length<4)st.pin+=v;
      $('#pinDots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<st.pin.length?'on':''}"></i>`).join('');
      if(st.pin.length===4){if(st.pin==='1234'){st.pin='';go('home',{noHist:true});st.hist=[];toast('SOS turned off. Your contacts know you are safe.')}else{st.pin='';$('#pinMsg').textContent='Wrong PIN. Try again.';const d=$('#pinDots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');setTimeout(()=>{d.innerHTML=[0,1,2,3].map(()=>'<i></i>').join('')},200)}}return}
  }
  const p=e.target.closest('[data-pick]');
  if(p){const g=p.closest('[data-group]');if(g){if(g.dataset.group==='many')p.setAttribute('aria-pressed',p.getAttribute('aria-pressed')!=='true');else g.querySelectorAll('[data-pick]').forEach(x=>x.setAttribute('aria-pressed',x===p))}return}
  const t=e.target.closest('[data-toggle]');if(t){t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true');return}
  const g=e.target.closest('[data-go]');if(g){const id=g.dataset.go;const nav=NAV.some(n=>n[0]===id);go(id,{noHist:false});return}
});
try{const t=localStorage.getItem('sj-theme');if(t&&t!=='auto')setTheme(t)}catch(e){}
function fitPhone(){
  const phone=$('#phone');if(!phone)return;
  if(window.innerWidth<=520){phone.style.zoom='';return}
  const stage=document.querySelector('.stage'),idx=document.querySelector('.index');
  if(!stage)return;
  const cs=getComputedStyle(stage);
  const padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
  const padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const gap=parseFloat(cs.gap)||0;
  const idxVisible=idx&&getComputedStyle(idx).display!=='none';
  const idxW=idxVisible?idx.getBoundingClientRect().width+gap:0;
  const availW=stage.clientWidth-padX-idxW;
  const availH=stage.clientHeight-padY;
  const naturalW=412,naturalH=864; // .phone's unzoomed rendered box: 392x844 design size + 10px border on each side
  let z=Math.min(availW/naturalW,availH/naturalH,1.4);
  z=z*0.8; // calibrated against a real 1920x1080 @125% Windows scale laptop in Brave: fit-to-space alone still rendered visibly too large, 80% of that matched what looked right
  z=Math.max(z,0.45);
  phone.style.zoom=z.toFixed(3);
}
window.addEventListener('resize',fitPhone);
buildIndex();render();fitPhone();
setTimeout(fitPhone,60);
</script>
